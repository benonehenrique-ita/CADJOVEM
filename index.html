<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrícula de Alunos - CADJOVEM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #003366;
            text-align: center;
        }
        .bloco {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            background: #fafafa;
        }
        .bloco-titulo {
            background: #003366;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            margin: -15px -15px 15px -15px;
            border-radius: 4px 4px 0 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #003366;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #002244;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #003366;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MATRÍCULA DE ALUNOS - CADJOVEM</h2>

    <div class="form-group">
        <label for="buscaAluno">BUSCAR ALUNO:</label>
        <input type="text" id="buscaAluno" list="listaAlunos" placeholder="Digite o nome do aluno..." oninput="buscarAlunoPorNome()">
        <datalist id="listaAlunos"></datalist>
    </div>

    <form id="formMatricula">
        <!-- Bloco 01 Identificação -->
        <div class="bloco">
            <div class="bloco-titulo">Bloco 01 Identificação</div>
            <div class="form-group">
                <label for="codigo">CÓDIGO (PK):</label>
                <input type="text" id="codigo" readonly>
            </div>
            <div class="form-group">
                <label for="dataInclusao">DATA DE INCLUSÃO:</label>
                <input type="date" id="dataInclusao">
            </div>
            <div class="form-group">
                <label for="nomeAluno">NOME DO ALUNO:</label>
                <input type="text" id="nomeAluno" required>
            </div>
            <div class="form-group">
                <label for="dataNascimento">DATA DE NASCIMENTO:</label>
                <input type="date" id="dataNascimento">
            </div>
            <div class="form-group">
                <label for="sexo">SEXO:</label>
                <select id="sexo">
                    <option value="M">M</option>
                    <option value="F">F</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            <div class="form-group">
                <label for="estadoCivil">ESTADO CIVIL:</label>
                <input type="text" id="estadoCivil">
            </div>
            <div class="form-group">
                <label for="nomePai">NOME DO PAI:</label>
                <input type="text" id="nomePai">
            </div>
            <div class="form-group">
                <label for="nomeMae">NOME DA MÃE:</label>
                <input type="text" id="nomeMae">
            </div>
        </div>

        <!-- Bloco 02 Endereço e Documentos -->
        <div class="bloco">
            <div class="bloco-titulo">Bloco 02 Endereço e Documentos</div>
            <div class="form-group">
                <label for="endereco">ENDEREÇO:</label>
                <input type="text" id="endereco">
            </div>
            <div class="form-group">
                <label for="bairro">BAIRRO:</label>
                <input type="text" id="bairro">
            </div>
            <div class="form-group">
                <label for="cidade">CIDADE:</label>
                <input type="text" id="cidade">
            </div>
            <div class="form-group">
                <label for="estado">ESTADO:</label>
                <input type="text" id="estado">
            </div>
            <div class="form-group">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" placeholder="00000-000">
            </div>
            <div class="form-group">
                <label for="telefone">TELEFONE:</label>
                <input type="text" id="telefone">
            </div>
            <div class="form-group">
                <label for="rgCpf">RG OU CPF:</label>
                <input type="text" id="rgCpf">
            </div>
        </div>

        <!-- Bloco 03 Qualificação -->
        <div class="bloco">
            <div class="bloco-titulo">Bloco 03 Qualificação</div>
            <div class="form-group">
                <label for="curso">CURSO / ATIVIDADE:</label>
                <input type="text" id="curso">
            </div>
        </div>

        <button type="submit">Salvar Matrícula</button>
    </form>

    <h3 style="margin-top: 30px; color: #003366;">Alunos Cadastrados</h3>
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Data Inclusão</th>
                <th>Nome do Aluno</th>
                <th>Telefone</th>
                <th>Curso</th>
            </tr>
        </thead>
        <tbody id="tabelaRegistros">
            <!-- Dados inseridos via script -->
        </tbody>
    </table>
</div>

<script>
    // Simulação de banco de dados local ou array de registros
    let alunosSalvos = [
        { codigo: 1, data_inclusao: '2026-01-10', nome_aluno: 'Ana Souza', telefone: '(11) 99999-1111', curso: 'Jovem Programador' },
        { codigo: 2, data_inclusao: '2026-02-15', nome_aluno: 'Bruno Oliveira', telefone: '(11) 98888-2222', curso: 'Música e Arte' },
        { codigo: 3, data_inclusao: '2026-03-20', nome_aluno: 'Carlos Eduardo', telefone: '(11) 97777-3333', curso: 'Esportes' },
        { codigo: 4, data_inclusao: '2026-04-05', nome_aluno: 'Daniela Lima', telefone: '(11) 96666-4444', curso: 'Informática Básica' },
        { codigo: 5, data_inclusao: '2026-08-28', nome_aluno: 'Elena Rodrigues', telefone: '(11) 95555-5555', curso: 'Teatro' }
    ];

    function gerarProximoCodigo() {
        if (alunosSalvos.length === 0) return 1;
        const max = Math.max(...alunosSalvos.map(a => a.codigo));
        return max + 1;
    }

    function atualizarTabelaEBusca() {
        const tbody = document.getElementById('tabelaRegistros');
        const datalist = document.getElementById('listaAlunos');
        if (!tbody || !datalist) return;

        tbody.innerHTML = '';
        datalist.innerHTML = '';

        alunosSalvos.forEach(aluno => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><strong>${aluno.codigo}</strong></td><td>${aluno.data_inclusao || '-'}</td><td>${aluno.nome_aluno}</td><td>${aluno.telefone || '-'}</td><td>${aluno.curso || '-'}</td>`;
            tbody.appendChild(tr);

            if (aluno.nome_aluno) {
                const option = document.createElement('option');
                // Formato correto exibindo o Nome do Aluno seguido do Código
                option.value = `${aluno.nome_aluno} [Código: ${aluno.codigo}]`;
                datalist.appendChild(option);
            }
        });
    }

    function inicializarFormulario() {
        document.getElementById('codigo').value = gerarProximoCodigo();
        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('dataInclusao').value = hoje;
        atualizarTabelaEBusca();
    }

    document.getElementById('formMatricula').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const novoAluno = {
            codigo: parseInt(document.getElementById('codigo').value),
            data_inclusao: document.getElementById('dataInclusao').value,
            nome_aluno: document.getElementById('nomeAluno').value,
            telefone: document.getElementById('telefone').value,
            curso: document.getElementById('curso').value
        };

        alunosSalvos.push(novoAluno);
        alert('Matrícula salva com sucesso!');
        this.reset();
        inicializarFormulario();
    });

    function buscarAlunoPorNome() {
        const valorBusca = document.getElementById('buscaAluno').value;
        // Extrai o código caso o usuário selecione a opção do datalist no formato "Nome [Código: X]"
        const match = valorBusca.match(/\[Código:\s*(\d+)\]/);
        
        if (match) {
            const codigoBusca = parseInt(match[1]);
            const alunoEncontrado = alunosSalvos.find(a => a.codigo === codigoBusca);
            if (alunoEncontrado) {
                document.getElementById('codigo').value = alunoEncontrado.codigo;
                document.getElementById('dataInclusao').value = alunoEncontrado.data_inclusao || '';
                document.getElementById('nomeAluno').value = alunoEncontrado.nome_aluno || '';
                document.getElementById('telefone').value = alunoEncontrado.telefone || '';
                document.getElementById('curso').value = alunoEncontrado.curso || '';
            }
        }
    }

    // Inicializa na carga da página
    window.onload = inicializarFormulario;
</script>

</body>
</html>
