<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrícula de Alunos - CADJOVEM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #003366;
            text-align: center;
        }
        .bloco {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            background: #fafafa;
        }
        .bloco-titulo {
            background: #003366;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            margin: -15px -15px 15px -15px;
            border-radius: 4px 4px 0 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #003366;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #002244;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #003366;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MATRÍCULA DE ALUNOS - CADJOVEM</h2>

    <div class="form-group">
        <label for="buscaAluno">BUSCAR ALUNO:</label>
        <input type="text" id="buscaAluno" list="listaAlunos" placeholder="Digite o nome do aluno..." oninput="buscarAlunoPorNome()">
        <datalist id="listaAlunos"></datalist>
    </div>

    <form id="formMatricula">
        <!-- Bloco 01 Identificação -->
        <div class="bloco">
            <div class="bloco-titulo">Bloco 01 Identificação</div>
            <div class="form-group">
                <label for="codigo">CÓDIGO (PK):</label>
                <input type="text" id="codigo" readonly>
            </div>
            <div class="form-group">
                <label for="dataInclusao">DATA DE INCLUSÃO:</label>
                <input type="date" id="dataInclusao">
            </div>
            <div class="form-group">
                <label for="nomeAluno">NOME DO ALUNO:</label>
                <input type="text" id="nomeAluno" required>
            </div>
            <div class="form-group">
                <label for="dataNascimento">DATA DE NASCIMENTO:</label>
                <input type="date" id="dataNascimento">
            </div>
            <div class="form-group">
                <label for="sexo">SEXO:</label>
                <select id="sexo">
                    <option value="M">M</option>
                    <option value="F">F</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            <div class="form-group">
                <label for="estadoCivil">ESTADO CIVIL:</label>
                <input type="text" id="estadoCivil">
            </div>
            <div class="form-group">
                <label for="nomePai">NOME DO PAI:</label>
                <input type="text" id="nomePai">
            </div>
            <div class="form-group">
                <label for="nomeMae">NOME DA MÃE:</label>
                <input type="text" id="nomeMae">
            </div>
        </div>

        <!-- Bloco 02 Endereço e Documentos -->
        <div class="bloco">
            <div class="bloco-titulo">Bloco 02 Endereço e Documentos</div>
            <div class="form-group">
                <label for="endereco">ENDEREÇO:</label>
                <input type="text" id="endereco">
            </div>
            <div class="form-group">
                <label for="bairro">BAIRRO:</label>
                <input type="text" id="bairro">
            </div>
            <div class="form-group">
                <label for="cidade">CIDADE:</label>
                <input type="text" id="cidade">
            </div>
            <div class="form-group">
                <label for="estado">ESTADO:</label>
                <input type="text" id="estado">
            </div>
            <div class="form-group">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" placeholder="00000-000">
            </div>
            <div class="form-group">
                <label for="telefone">TELEFONE:</label>
                <input type="text" id="telefone">
            </div>
            <div class="form-group">
                <label for="rgCpf">RG OU CPF:</label>
                <input type="text" id="rgCpf">
            </div>
        </div>

        <!-- Bloco 03 Qualificação -->
        <div class="bloco">
            <div class="bloco-titulo">Bloco 03 Qualificação</div>
            <div class="form-group">
                <label for="curso">CURSO OU ATIVIDADE QUE PRETENDE FAZER:</label>
                <input type="text" id="curso">
            </div>
        </div>

        <button type="submit">Salvar Matrícula</button>
    </form>

    <h3 style="margin-top: 30px; color: #003366;">Alunos Cadastrados</h3>
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Data Inclusão</th>
                <th>Nome do Aluno</th>
                <th>Telefone</th>
                <th>Curso / Atividade</th>
            </tr>
        </thead>
        <tbody id="tabelaRegistros">
            <!-- Dados inseridos via script -->
        </tbody>
    </table>
</div>

<script>
    // Array estruturado exatamente com base nos dados reais do Access informados
    let alunosSalvos = [
        {
            codigo: 3,
            dataInclusao: '2013-02-06',
            nomeAluno: 'ÂNGELA MARIA PAES DE SOUZA',
            dataNascimento: '1994-11-30',
            sexo: 'F',
            estadoCivil: 'SOLTEIRA',
            nomePai: 'ARLINDO ELIZIANO DE SOUZA',
            nomeMae: 'MARLEIDE PAES DE ANDRADE',
            endereco: 'TRAVESSA AMANCIO PEREIRA, Nº 105',
            bairro: 'CENTRO',
            cidade: 'ITAPETIM',
            estado: 'PE',
            cep: '56720-000',
            telefone: '',
            rgCpf: '123.456.789-01',
            curso: 'INFORMÁTICA BÁSICA'
        },
        {
            codigo: 4,
            dataInclusao: '2013-02-05',
            nomeAluno: 'PAULA DOS SANTOS MOURA',
            dataNascimento: '1981-08-26',
            sexo: 'F',
            estadoCivil: 'SOLTEIRA',
            nomePai: 'VALDECIR AURÉLIO DE MOURA',
            nomeMae: 'ALDA DOS SANTOS MOURA',
            endereco: 'RUA CRIZANTO VALDEVINO, Nº 109',
            bairro: 'CENTRO',
            cidade: 'ITAPETIM',
            estado: 'PE',
            cep: '56720-000',
            telefone: '(87) 3853-1421',
            rgCpf: '387.508.147-12',
            curso: 'INFORMÁTICA BÁSICA'
        },
        {
            codigo: 5,
            dataInclusao: '2013-02-07',
            nomeAluno: 'LAMARTINE VICENTE DA SILVA',
            dataNascimento: '1968-03-05',
            sexo: 'F',
            estadoCivil: 'CASADA',
            nomePai: 'FRANCELINO VICENTE DA SILVA',
            nomeMae: 'PETUA MARIA DA CONCEIÇÃO',
            endereco: 'RUA PADRE JOSÉ QUEREL, Nº 469',
            bairro: 'CENTRO',
            cidade: 'ITAPETIM',
            estado: 'PE',
            cep: '56720-000',
            telefone: '(87) 9908-6262',
            rgCpf: '3.796.555',
            curso: 'INFORMÁTICA BÁSICA'
        }
    ];

    function gerarProximoCodigo() {
        if (alunosSalvos.length === 0) return 1;
        const max = Math.max(...alunosSalvos.map(a => a.codigo));
        return max + 1;
    }

    function atualizarTabelaEBusca() {
        const tbody = document.getElementById('tabelaRegistros');
        const datalist = document.getElementById('listaAlunos');
        if (!tbody || !datalist) return;

        tbody.innerHTML = '';
        datalist.innerHTML = '';

        alunosSalvos.forEach(aluno => {
            // Preenche a tabela visual inferior
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${aluno.codigo}</strong></td>
                <td>${aluno.dataInclusao || '-'}</td>
                <td>${aluno.nomeAluno || '-'}</td>
                <td>${aluno.telefone || '-'}</td>
                <td>${aluno.curso || '-'}</td>
            `;
            tbody.appendChild(tr);

            // Popula o datalist usando exclusivamente o Nome do Aluno e o Código correspondente
            if (aluno.nomeAluno) {
                const option = document.createElement('option');
                option.value = `${aluno.nomeAluno} [Código: ${aluno.codigo}]`;
                datalist.appendChild(option);
            }
        });
    }

    function inicializarFormulario() {
        document.getElementById('codigo').value = gerarProximoCodigo();
        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('dataInclusao').value = hoje;
        atualizarTabelaEBusca();
    }

    document.getElementById('formMatricula').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const novoAluno = {
            codigo: parseInt(document.getElementById('codigo').value),
            dataInclusao: document.getElementById('dataInclusao').value,
            nomeAluno: document.getElementById('nomeAluno').value,
            dataNascimento: document.getElementById('dataNascimento').value,
            sexo: document.getElementById('sexo').value,
            estadoCivil: document.getElementById('estadoCivil').value,
            nomePai: document.getElementById('nomePai').value,
            nomeMae: document.getElementById('nomeMae').value,
            endereco: document.getElementById('endereco').value,
            bairro: document.getElementById('bairro').value,
            cidade: document.getElementById('cidade').value,
            estado: document.getElementById('estado').value,
            cep: document.getElementById('cep').value,
            telefone: document.getElementById('telefone').value,
            rgCpf: document.getElementById('rgCpf').value,
            curso: document.getElementById('curso').value
        };

        alunosSalvos.push(novoAluno);
        alert('Matrícula salva com sucesso!');
        this.reset();
        inicializarFormulario();
    });

    function buscarAlunoPorNome() {
        const valorBusca = document.getElementById('buscaAluno').value;
        const match = valorBusca.match(/\[Código:\s*(\d+)\]/);
        
        if (match) {
            const codigoBusca = parseInt(match[1]);
            const alunoEncontrado = alunosSalvos.find(a => a.codigo === codigoBusca);
            if (alunoEncontrado) {
                document.getElementById('codigo').value = alunoEncontrado.codigo;
                document.getElementById('dataInclusao').value = alunoEncontrado.dataInclusao || '';
                document.getElementById('nomeAluno').value = alunoEncontrado.nomeAluno || '';
                document.getElementById('dataNascimento').value = alunoEncontrado.dataNascimento || '';
                document.getElementById('sexo').value = alunoEncontrado.sexo || 'M';
                document.getElementById('estadoCivil').value = alunoEncontrado.estadoCivil || '';
                document.getElementById('nomePai').value = alunoEncontrado.nomePai || '';
                document.getElementById('nomeMae').value = alunoEncontrado.nomeMae || '';
                document.getElementById('endereco').value = alunoEncontrado.endereco || '';
                document.getElementById('bairro').value = alunoEncontrado.bairro || '';
                document.getElementById('cidade').value = alunoEncontrado.cidade || '';
                document.getElementById('estado').value = alunoEncontrado.estado || '';
                document.getElementById('cep').value = alunoEncontrado.cep || '';
                document.getElementById('telefone').value = alunoEncontrado.telefone || '';
                document.getElementById('rgCpf').value = alunoEncontrado.rgCpf || '';
                document.getElementById('curso').value = alunoEncontrado.curso || '';
            }
        }
    }

    // Inicializa na carga da página
    window.onload = inicializarFormulario;
</script>

</body>
</html>
