<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CADJOVEM - Cadastro e Matrícula de Alunos | Itapetim-PE</title>

<meta name="description" content="CADJOVEM - Sistema de cadastro e matrícula de alunos da Casa das Juventudes de Itapetim-PE.">
<meta name="keywords" content="CADJOVEM, CAD Jovem, Casa das Juventudes, Itapetim, Itapetim PE, cadastro de alunos, matrícula de alunos">
<meta name="author" content="Benone Henrique de Sousa">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://benonehenrique-ita.github.io/CADJOVEM/">

<style>
* {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
}

body {
    background: #eef2f7;
    padding: 20px;
}

/* ================= LOGIN ================= */

#loginOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,43,102,0.96);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.login-card {
    background: #fff;
    padding: 30px;
    border-radius: 8px;
    width: 350px;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
    text-align: center;
    border: 2px solid #002b66;
}

.login-card h2 {
    color: #002b66;
    margin-bottom: 20px;
    font-size: 18px;
    text-transform: uppercase;
}

.login-card input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    font-size: 14px;
}

.login-card button {
    width: 100%;
    padding: 10px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
}

/* ================= CONTAINER ================= */

.container {
    max-width: 980px;
    margin: 0 auto;
    background: #fff;
    border: 2px solid #002b66;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    display: none;
}

/* ================= CABEÇALHO ================= */

.header {
    background: #002b66;
    color: white;
    padding: 15px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.header h1 {
    font-size: 20px;
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.search-box {
    display: flex;
    gap: 5px;
}

.search-box input {
    padding: 7px 10px;
    width: 180px;
    border-radius: 4px;
    border: 1px solid #ccc;
    text-transform: uppercase;
}

/* ================= FORMULÁRIO ================= */

form {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.block {
    border: 2px solid #002b66;
    background: #002b66;
    padding: 12px;
    border-radius: 6px;
}

.block-title {
    background: #d0e1f9;
    color: #002b66;
    text-align: center;
    font-weight: bold;
    font-size: 13px;
    padding: 4px 15px;
    margin: -20px auto 12px;
    width: fit-content;
    border-radius: 4px;
    border: 1px solid #002b66;
}

.row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.row:last-child {
    margin-bottom: 0;
}

.field {
    display: flex;
    align-items: center;
    background: white;
    border-radius: 4px;
    flex: 1;
    min-width: 0;
    padding: 2px;
}

.field label {
    background: #e2e8f0;
    color: #0f172a;
    font-size: 11px;
    font-weight: bold;
    padding: 7px 8px;
    white-space: nowrap;
    border-radius: 3px;
    margin-right: 4px;
    border: 1px solid #cbd5e1;
    text-transform: uppercase;
}

.field input,
.field select {
    border: 1px solid #cbd5e1;
    border-radius: 3px;
    outline: none;
    padding: 6px 8px;
    width: 100%;
    min-width: 0;
    font-size: 12px;
    text-transform: uppercase;
    background: white;
    color: #000;
}

.field input[readonly] {
    background: #f1f5f9;
    color: #475569;
    font-weight: bold;
}

.primary-key label {
    background: #fde047;
    color: #713f12;
    border-color: #eab308;
}

/* LARGURAS */

.w-codigo {
    flex: 0 0 190px;
}

.w-inclusao {
    flex: 0 0 270px;
}

.w-uf {
    flex: 0 0 110px;
}

.w-cep {
    flex: 0 0 160px;
}

.w-tel {
    flex: 0 0 190px;
}

.w-small {
    flex: 0 0 140px;
}

.w-medium {
    flex: 0 0 280px;
}

/* ================= TURNOS ================= */

.turnos {
    display: flex;
    align-items: center;
    gap: 25px;
    background: white;
    padding: 7px 12px;
    border-radius: 4px;
    width: 100%;
}

.turnos label {
    background: none !important;
    border: none !important;
    margin: 0 !important;
    padding: 3px !important;
    color: #002b66;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
}

.turnos input {
    width: auto;
}

/* ================= BOTÕES ================= */

.form-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.btn {
    padding: 8px 12px;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
}

.btn-search {
    background: #0284c7;
    color: white;
}

.btn-submit {
    background: #16a34a;
    color: white;
}

.btn-clear {
    background: #f59e0b;
    color: white;
}

.btn-print {
    background: #2563eb;
    color: white;
}

.btn-import {
    background: #8b5cf6;
    color: white;
}

.btn-report {
    background: #0d9488;
    color: white;
}

.btn-logout {
    background: #dc2626;
    color: white;
}

.btn-pass {
    background: #475569;
    color: white;
}

.btn-danger {
    background: #b91c1c;
    color: white;
}

.btn-comprovante {
    background: #7c3aed;
    color: white;
}

/* ================= REGISTROS ================= */

.records-section {
    padding: 20px;
    background: white;
    border-top: 2px solid #002b66;
}

.records-section h2 {
    font-size: 15px;
    color: #002b66;
    margin-bottom: 12px;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

table,
th,
td {
    border: 1px solid #cbd5e1;
}

th {
    background: #002b66;
    color: white;
    padding: 8px;
    text-align: left;
}

td {
    padding: 8px;
}

tr:nth-child(even) {
    background: #f8fafc;
}

/* ================= MODAIS ================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    z-index: 10000;
    padding: 20px;
    overflow-y: auto;
}

.report-content {
    background: white;
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
    border-radius: 6px;
    border: 2px solid #002b66;
}

.report-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    border-bottom: 2px solid #002b66;
    padding-bottom: 10px;
}

.report-header h2 {
    color: #002b66;
    font-size: 16px;
}

/* ================= COMPROVANTE (EXATAMENTE MEIA PÁGINA) ================= */

#comprovantePrint {
    display: none;
}

.comprovante {
    width: 100%;
    height: 130mm;
    max-height: 130mm;
    box-sizing: border-box;
    border: 1.5px solid #002b66;
    padding: 6px 10px;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: white;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    page-break-inside: avoid;
    break-inside: avoid;
}

.comprovante-cabecalho {
    text-align: center;
    border-bottom: 2px solid #002b66;
    padding-bottom: 2px;
    margin-bottom: 2px;
}

.comprovante-cabecalho h1 {
    font-size: 12px;
    color: #002b66;
    margin-bottom: 0px;
}

.comprovante-cabecalho h2 {
    font-size: 9px;
    color: #333;
}

.comprovante-titulo {
    text-align: center;
    font-size: 9.5px;
    font-weight: bold;
    margin: 2px 0;
    color: #002b66;
}

.comp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px 8px;
    font-size: 9px;
}

.comp-item {
    border-bottom: 1px solid #ccc;
    padding: 1px 0;
}

.comp-item strong {
    color: #002b66;
}

.assinatura {
    margin-top: 4px;
    text-align: center;
    font-size: 9px;
}

.linha-assinatura {
    width: 45%;
    border-top: 1px solid #000;
    margin: 8px auto 2px;
}

.corte {
    border-top: 1.5px dashed #555;
    margin: 2px 0;
    text-align: center;
    font-size: 6.5px;
    color: #555;
    line-height: 1px;
}

/* ================= RESPONSIVO ================= */

@media(max-width:700px) {
    body {
        padding: 5px;
    }
    .container {
        width: 100%;
    }
    .field {
        flex: 1 1 100% !important;
    }
    .header-actions {
        width: 100%;
    }
    .search-box {
        width: 100%;
    }
    .search-box input {
        width: 100%;
    }
    .comp-grid {
        grid-template-columns: 1fr;
    }
}

/* ================= IMPRESSÃO RIGOROSA (EXATAMENTE 1 PÁGINA) ================= */

@media print {
    body * {
        visibility: hidden !important;
    }

    #comprovantePrint,
    #comprovantePrint * {
        visibility: visible !important;
    }

    #comprovantePrint {
        display: flex !important;
        flex-direction: column;
        justify-content: space-between;
        position: absolute;
        left: 0;
        top: 0;
        width: 210mm;
        height: 297mm;
        padding: 4mm 8mm;
        background: white;
        overflow: hidden;
        page-break-after: avoid;
        break-after: avoid;
    }

    .no-print {
        display: none !important;
    }

    @page {
        size: A4 portrait;
        margin: 0mm;
    }
}
</style>
</head>

<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2>CADJOVEM</h2>
        <input type="text" id="loginUsuario" placeholder="Usuário" autocomplete="off">
        <input type="password" id="loginSenha" placeholder="Senha" autocomplete="new-password">
        <button onclick="realizarLogin()">Entrar</button>
    </div>
</div>
